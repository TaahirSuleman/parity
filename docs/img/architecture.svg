<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1240" height="560" fill="#ffffff"/>
<text x="20" y="34" font-size="20" font-weight="700" fill="#111">Parity: what a sighted user sees vs what a screen reader gets</text>
<text x="20" y="56" font-size="13" fill="#475569">Blue: a Meta model decides. Grey: deterministic code acts and checks. A finding exists only after the Verifier; a fix lands only after a human.</text>
<text x="20" y="96" font-size="14" font-weight="700" fill="#111">1 · Walk, perceive, verify — for every screen the Navigator reaches</text>
<rect x="20" y="110" width="190" height="78" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><text x="115.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Navigator</text><text x="115.0" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Muse Spark 1.3 · computer use</text><text x="115.0" y="174" text-anchor="middle" font-size="12.5" fill="#1f2937">allow-listed executor</text>
<line x1="210" y1="149.0" x2="230" y2="149.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="230" y="110" width="190" height="78" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="325.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Capture (code)</text><text x="325.0" y="155" text-anchor="middle" font-size="12.5" fill="#1f2937">screenshot · AX tree</text><text x="325.0" y="174" text-anchor="middle" font-size="12.5" fill="#1f2937">axe-core</text>
<line x1="420" y1="149.0" x2="440" y2="149.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="440" y="110" width="190" height="78" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><text x="535.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Seer</text><text x="535.0" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Muse Spark 1.3 · grounding</text><text x="535.0" y="174" text-anchor="middle" font-size="12.5" fill="#1f2937">what is seen, boxed</text>
<line x1="630" y1="149.0" x2="650" y2="149.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="650" y="110" width="190" height="78" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><text x="745.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Comparator</text><text x="745.0" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Muse Spark 1.3</text><text x="745.0" y="174" text-anchor="middle" font-size="12.5" fill="#1f2937">where seen ≠ announced</text>
<line x1="840" y1="149.0" x2="860" y2="149.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="860" y="110" width="190" height="78" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="955.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Verifier (code)</text><text x="955.0" y="155" text-anchor="middle" font-size="12.5" fill="#1f2937">located · exact quote · diverges</text><text x="955.0" y="174" text-anchor="middle" font-size="12.5" fill="#1f2937">not axe · unique</text>
<line x1="1050" y1="132" x2="1085" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="1067.5" y="126" text-anchor="middle" font-size="12" fill="#475569">fails</text>
<rect x="1085" y="114" width="135" height="36" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="1152" y="137" text-anchor="middle" font-size="12.5" fill="#111">rejected candidate</text>
<line x1="1050" y1="168" x2="1085" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><text x="1067.5" y="162" text-anchor="middle" font-size="12" fill="#475569">passes</text>
<rect x="1085" y="150" width="135" height="36" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="1152" y="173" text-anchor="middle" font-size="12.5" fill="#111">verified finding</text>
<path d="M1152,186 L1152,250 L115.0,250 L115.0,288" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="20" y="236" font-size="14" font-weight="700" fill="#111">2 · Judge, repair, decide — for every verified finding</text>
<rect x="20" y="290" width="190" height="78" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><text x="115.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Judge</text><text x="115.0" y="335" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Muse Spark 1.3</text><text x="115.0" y="354" text-anchor="middle" font-size="12.5" fill="#1f2937">barrier? severity · WCAG</text>
<line x1="210" y1="329.0" x2="230" y2="329.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="230" y="290" width="190" height="78" rx="6" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/><text x="325.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Fixer</text><text x="325.0" y="335" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2937">Muse Spark 1.3</text><text x="325.0" y="354" text-anchor="middle" font-size="12.5" fill="#1f2937">minimal HTML change</text>
<line x1="420" y1="329.0" x2="440" y2="329.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="440" y="290" width="190" height="78" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="535.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Re-audit (code + Spark)</text><text x="535.0" y="335" text-anchor="middle" font-size="12.5" fill="#1f2937">patched page in a sandbox</text><text x="535.0" y="354" text-anchor="middle" font-size="12.5" fill="#1f2937">name rule · comparator again</text>
<line x1="630" y1="329.0" x2="650" y2="329.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="650" y="290" width="190" height="78" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="745.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Human gate</text><text x="745.0" y="335" text-anchor="middle" font-size="12.5" fill="#1f2937">approve / reject with a reason</text><text x="745.0" y="354" text-anchor="middle" font-size="12.5" fill="#1f2937">fix.patch of approved fixes</text>
<line x1="840" y1="329.0" x2="860" y2="329.0" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="860" y="290" width="190" height="78" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="955.0" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Run bundle</text><text x="955.0" y="335" text-anchor="middle" font-size="12.5" fill="#1f2937">JSON + PNG, the record</text><text x="955.0" y="354" text-anchor="middle" font-size="12.5" fill="#1f2937">SSE to the workbench</text>
<text x="20" y="420" font-size="13" fill="#1f2937">Every model call is cached on disk and traced: model, request ID, tokens, latency, cost. Replay plays a recorded run with no model calls; Live runs the pipeline (rate-limited).</text>
<text x="20" y="442" font-size="13" fill="#1f2937">Measured on 38 seeded, axe-passing faults (3 runs): full Parity 84% recall / 97% precision · screenshot only 17% · tree only 75% · no grounding 82% · axe-core 0%.</text>
<text x="20" y="464" font-size="13" fill="#1f2937">Findings are evidence, not a conformance claim; a human approves every fix. Built on Meta’s Model API: Muse Spark 1.3 (contributor tier by default).</text>
<rect x="20" y="500" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#1a56db"/><text x="40" y="512" font-size="12.5" fill="#1f2937">Meta model (Muse Spark 1.3)</text>
<rect x="230" y="500" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#475569"/><text x="250" y="512" font-size="12.5" fill="#1f2937">deterministic code</text>
</svg>