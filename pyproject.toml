[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parity"
version = "0.1.0"
description = "An agent that compares what sighted users see with what screen-reader users get, and proves the gaps axe-core misses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "playwright>=1.64,<2",
  "pydantic>=2.14,<3",
  "sse-starlette>=3.6,<4",
  "aiosqlite>=0.22,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.2,<2",
  "google-cloud-storage>=3.17,<4",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
]

[project.scripts]
parity = "parity.cli:main"

[tool.setuptools.packages.find]
include = ["parity*"]

[tool.setuptools.package-data]
parity = ["vendor/*", "static/**/*", "meta/prompts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:parity.*"]
