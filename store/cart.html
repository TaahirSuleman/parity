<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart · ShopRight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <span class="brand">ShopRight</span>
  <nav aria-label="Primary"><a href="product.html">Shop</a><a href="cart.html">Cart</a></nav>
</header>
<main>
  <section class="card" aria-labelledby="cart-h">
    <h1 id="cart-h">Your cart</h1>
    <div class="line">
      <span><img id="item-thumb" alt="image" width="40" height="30" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='30'><rect width='40' height='30' rx='3' fill='%23dfe3ea'/><ellipse cx='20' cy='15' rx='11' ry='9' fill='%231f2430'/></svg>"> Noise-cancelling headphones</span>
      <span>
        <button id="k1" class="icon" type="button" aria-label="Decrease quantity">−</button>
        <span id="qty" aria-live="polite">1</span>
        <button id="k2" class="icon" type="button" aria-label="Increase quantity">+</button>
        <button id="k3" class="icon" type="button" aria-label="Close">🗑️</button>
      </span>
    </div>
    <div class="line">
      <span>Carry case</span>
      <span><label for="case-qty" class="small">Qty</label> <input id="case-qty" class="qty err" value="12" inputmode="numeric"> <button id="case-remove" class="icon" type="button" aria-label="Remove carry case">🗑️</button></span>
    </div>
    <div class="line"><span>Subtotal</span><span>R1,448.00</span></div>
    <div class="line"><span>Coupon</span><span><canvas id="coupon-savings" width="90" height="20" role="presentation"></canvas></span></div>
    <div class="line"><span>Delivery</span><span id="k4"><img alt="" width="40" height="18" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='18'><text x='0' y='14' font-size='14' font-family='Arial' fill='%230a7d3b' font-weight='bold'>Free</text></svg>"></span></div>
    <p class="total">Total: R1,323.00</p>
    <div class="actions">
      <a id="k5" class="btn" href="checkout.html" style="text-decoration:none;display:inline-block">Checkout</a>
      <a id="k6" href="product.html">Continue shopping</a>
    </div>
  </section>
  <section class="card" aria-labelledby="options-h">
    <h2 id="options-h">Options</h2>
    <p class="row"><input id="promo-input" placeholder="Promo code"> <button id="promo-apply" class="ghost" type="button">Apply</button></p>
    <p class="row"><span>Gift wrap</span> <button id="gift-wrap" class="switch on" type="button" aria-label="Gift wrap"><span class="knob"></span></button></p>
    <p class="row"><span class="small">Delivery</span>
      <button id="delivery-standard" class="tab current" type="button">Standard (free)</button>
      <button id="delivery-express" class="tab" type="button">Express (R99)</button>
    </p>
    <p><img id="trust-seal" alt="image" width="120" height="28" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='28'><rect width='120' height='28' rx='4' fill='%23eef2ff'/><text x='8' y='19' font-size='13' font-family='Arial' fill='%231f3b73'>🔒 Secure checkout</text></svg>"></p>
  </section>
</main>
<script>
  var qty = document.getElementById("qty");
  document.getElementById("k2").addEventListener("click", function () { qty.textContent = String(Number(qty.textContent) + 1); });
  document.getElementById("k1").addEventListener("click", function () { qty.textContent = String(Math.max(1, Number(qty.textContent) - 1)); });
  var c = document.getElementById("coupon-savings").getContext("2d");
  c.font = "bold 15px Arial"; c.fillStyle = "#0a7d3b"; c.fillText("−R125.00", 0, 15);
</script>
</body>
</html>
