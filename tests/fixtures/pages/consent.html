<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture: a consent banner</title></head>
<body style="margin:0;font-family:sans-serif">
<h1>Welcome to the fixture shop</h1>
<p>Nothing here is for sale.</p>
<div role="dialog" aria-label="Cookies" style="position:absolute;left:0;top:300px;width:1280px;height:120px;background:#eee">
  <p style="margin:8px">We use cookies.</p>
  <button type="button" id="accept" style="position:absolute;left:20px;top:60px;width:160px;height:36px">Accept all cookies</button>
  <button type="button" id="reject" style="position:absolute;left:200px;top:60px;width:160px;height:36px">Reject all</button>
  <button type="button" id="settings" style="position:absolute;left:380px;top:60px;width:160px;height:36px">Cookie settings</button>
</div>
</body></html>
