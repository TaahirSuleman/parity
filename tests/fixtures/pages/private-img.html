<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fixture: a page that loads a private subresource</title></head>
<body style="margin:0;font-family:sans-serif">
<h1>Fixture page</h1>
<p>This page asks the browser for an image on a loopback address; the request guard must abort that request and leave the page standing.</p>
<img id="private" src="http://127.0.0.1:__PORT__/private.png" alt="" width="40" height="40">
<button type="button" id="ok" style="position:absolute;left:20px;top:200px;width:120px;height:32px">Fine</button>
</body></html>
